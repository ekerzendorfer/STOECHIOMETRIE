<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stöchiometrie-Meister Pro | Komplett-Version</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        sub { font-size: 0.75em; vertical-align: sub; line-height: 0; }
        .tab-active { background-color: #2563eb; color: white; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .scaffolding-step { opacity: 0.3; transition: all 0.4s; }
        .scaffolding-step.active { opacity: 1; transform: translateX(8px); color: #2563eb; font-weight: 800; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-900 pb-20">

    <div class="max-w-6xl mx-auto px-4 py-8">
        <header class="bg-white p-6 rounded-3xl shadow-md border border-slate-200 mb-8 flex flex-col md:flex-row justify-between items-center gap-6">
            <div class="text-center md:text-left">
                <h1 class="text-3xl font-black text-blue-900 uppercase tracking-tighter italic">Stöchiometrie-Meister Pro</h1>
                <p class="text-slate-500 text-sm">Rechner, Labor & Academy</p>
            </div>
            
            <div class="flex items-center gap-3 bg-slate-100 p-2 rounded-2xl border">
                <span class="text-[10px] font-bold px-2 text-slate-400 uppercase">Sek 1</span>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="modeToggle" class="sr-only peer">
                    <div class="w-11 h-6 bg-slate-300 rounded-full peer peer-checked:bg-blue-600 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:after:translate-x-full"></div>
                </label>
                <span class="text-[10px] font-bold px-2 text-blue-600 uppercase">Sek 2</span>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-4 space-y-6">
                <nav class="bg-white p-2 rounded-2xl shadow-sm border flex gap-1">
                    <button id="btnRechner" class="flex-1 py-2 text-[10px] font-bold rounded-xl tab-active">RECHNER</button>
                    <button id="btnLabor" class="flex-1 py-2 text-[10px] font-bold rounded-xl text-slate-500">LABOR</button>
                    <button id="btnQuiz" class="flex-1 py-2 text-[10px] font-bold rounded-xl text-slate-500 uppercase">Üben</button>
                </nav>

                <div id="panelInput" class="bg-white p-6 rounded-3xl shadow-xl border border-blue-100">
                    <div id="boxRechner" class="space-y-4">
                        <label class="block">
                            <span class="text-[10px] font-bold text-slate-400 uppercase">Stoff wählen</span>
                            <select id="selSub" class="w-full mt-1 p-3 bg-slate-50 border-2 border-slate-100 rounded-xl outline-none focus:border-blue-500"></select>
                        </label>
                        <input type="number" id="inM" class="w-full p-3 bg-slate-50 border-2 border-slate-100 rounded-xl outline-none" placeholder="Masse m (g)">
                        <input type="number" id="inN" class="w-full p-3 bg-slate-50 border-2 border-slate-100 rounded-xl outline-none" placeholder="Stoffmenge n (mol)">
                    </div>

                    <div id="boxLabor" class="hidden space-y-4">
                        <label class="block">
                            <span class="text-[10px] font-bold text-slate-400 uppercase">Reaktion wählen</span>
                            <select id="selReac" class="w-full mt-1 p-3 bg-slate-50 border-2 border-slate-100 rounded-xl outline-none focus:border-blue-500"></select>
                        </label>
                        <input type="number" id="inEdukt" class="w-full p-3 bg-slate-50 border-2 border-slate-100 rounded-xl outline-none" placeholder="Eduktmenge (g)">
                    </div>

                    <div id="boxQuizConfig" class="hidden space-y-4">
                        <label class="block">
                            <span class="text-[10px] font-bold text-slate-400 uppercase">Anzahl Fragen</span>
                            <input type="number" id="quizCount" class="w-full mt-1 p-3 bg-slate-50 border-2 border-slate-100 rounded-xl outline-none focus:border-blue-500" value="5" min="5">
                        </label>
                    </div>

                    <button id="mainActionBtn" class="w-full mt-6 bg-blue-600 text-white font-black py-4 rounded-2xl shadow-lg active:scale-95 transition-all uppercase tracking-widest">Starten</button>
                </div>

                <div class="bg-slate-800 p-5 rounded-3xl shadow-xl border border-slate-700">
                    <p class="text-[9px] font-bold text-slate-400 uppercase mb-3 tracking-widest">Hilfs-Rechner</p>
                    <div class="flex gap-2 items-center">
                        <input type="text" id="mathInput" class="bg-black/20 p-2 rounded-lg flex-1 font-mono text-xs text-blue-300 outline-none border border-white/5" placeholder="Formel...">
                        <button id="mathCalcBtn" class="bg-blue-600 px-3 py-2 rounded-lg font-bold text-white">=</button>
                        <div id="mathRes" class="w-20 bg-black/40 p-2 rounded-lg font-mono text-xs text-green-400 text-center italic">0.00</div>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-8 space-y-6">
                <div id="viewResult" class="hidden bg-white p-8 rounded-3xl shadow-xl border-l-[12px] border-blue-600">
                    <div id="outHeader"></div>
                    <div id="outBody" class="mt-6 grid grid-cols-1 md:grid-cols-2 gap-4"></div>
                    
                    <div class="mt-8 bg-amber-50 p-4 rounded-2xl border-2 border-dashed border-amber-200">
                        <p class="text-[10px] font-bold text-amber-700 uppercase mb-1">⚠️ KI-Kritik: Max hat Mist gemacht</p>
                        <p id="maxError" class="text-sm text-amber-900 italic"></p>
                    </div>
                </div>

                <div id="viewQuiz" class="hidden bg-slate-900 text-white p-8 rounded-3xl shadow-2xl">
                    <div class="flex justify-between items-center mb-6 border-b border-white/10 pb-4">
                        <span id="quizProgress" class="text-blue-400 font-bold text-xs uppercase tracking-widest"></span>
                        <button onclick="location.reload()" class="text-[10px] text-red-400 uppercase font-bold">Beenden</button>
                    </div>
                    <div id="quizContent"></div>
                </div>

                <div id="quizFinish" class="hidden bg-white p-10 rounded-3xl shadow-2xl text-center border-t-8 border-blue-600">
                    <h2 class="text-4xl font-black text-blue-900 mb-4 uppercase">Training fertig!</h2>
                    <div class="text-6xl font-black text-blue-600 mb-8" id="finalScoreText"></div>
                    <button onclick="location.reload()" class="bg-blue-600 text-white px-10 py-4 rounded-2xl font-bold">NEUER START</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- LOGIK & DATEN ---
        function toHTML(s) { return s.replace(/([A-Z][a-z]*)(\d+)/g, '$1<sub>$2</sub>'); }
        function toUni(s) { const map = {'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉'}; return s.replace(/(\d+)/g, (m) => [...m].map(c => map[c] || c).join('')); }

        const subDB = {
            "H2O": { m: 18.015, name: "Wasser" }, "CO2": { m: 44.01, name: "Kohlenstoffdioxid" },
            "NaCl": { m: 58.44, name: "Natriumchlorid" }, "CH4": { m: 16.04, name: "Methan" },
            "Mg": { m: 24.31, name: "Magnesium" }, "MgO": { m: 40.30, name: "Magnesiumoxid" },
            "O2": { m: 31.99, name: "Sauerstoff" }, "Al": { m: 26.98, name: "Aluminium" },
            "Al2O3": { m: 101.96, name: "Aluminiumoxid" }, "NH3": { m: 17.03, name: "Ammoniak" },
            "N2": { m: 28.01, name: "Stickstoff" }, "Fe": { m: 55.85, name: "Eisen" },
            "HCl": { m: 36.46, name: "Salzsäure" }, "NaOH": { m: 40.00, name: "Natronlauge" }
        };

        const reacDB = {
            "R1": { name: "Methan-Verbrennung", eq: "CH4 + 2 O2 -> CO2 + 2 H2O", ratio: 1, edu: "CH4", prod: "CO2", mE: 16.04, mP: 44.01 },
            "R2": { name: "Magnesium-Oxidation", eq: "2 Mg + O2 -> 2 MgO", ratio: 1, edu: "Mg", prod: "MgO", mE: 24.31, mP: 40.30 },
            "R3": { name: "Aluminium-Verbrennung", eq: "4 Al + 3 O2 -> 2 Al2O3", ratio: 0.5, edu: "Al", prod: "Al2O3", mE: 26.98, mP: 101.96 },
            "R4": { name: "Ammoniak-Synthese", eq: "N2 + 3 H2 -> 2 NH3", ratio: 2, edu: "N2", prod: "NH3", mE: 28.01, mP: 17.03 }
        };

        const errorPool = ["Max hat O2 mit 16g gerechnet.", "Max hat m * M multipliziert.", "Koeffizienten wurden ignoriert."];

        // Init Dropdowns
        const sSel = document.getElementById('selSub');
        const rSel = document.getElementById('selReac');
        Object.keys(subDB).sort().forEach(k => {
            let o = document.createElement('option'); o.value = k; o.innerText = `${subDB[k].name} (${toUni(k)})`; sSel.appendChild(o);
        });
        Object.keys(reacDB).forEach(k => {
            let o = document.createElement('option'); o.value = k; o.innerText = reacDB[k].name; rSel.appendChild(o);
        });

        // Tab-System
        let currentTab = 'rechner';
        const tabBtns = { rechner: document.getElementById('btnRechner'), labor: document.getElementById('btnLabor'), quiz: document.getElementById('btnQuiz') };
        function switchTab(t) {
            currentTab = t;
            document.getElementById('boxRechner').classList.toggle('hidden', t !== 'rechner');
            document.getElementById('boxLabor').classList.toggle('hidden', t !== 'labor');
            document.getElementById('boxQuizConfig').classList.toggle('hidden', t !== 'quiz');
            document.getElementById('viewResult').classList.add('hidden');
            document.getElementById('viewQuiz').classList.add('hidden');
            document.getElementById('quizFinish').classList.add('hidden');
            Object.values(tabBtns).forEach(b => b.classList.remove('tab-active', 'text-slate-500'));
            tabBtns[t].classList.add('tab-active');
        }
        tabBtns.rechner.onclick = () => switchTab('rechner');
        tabBtns.labor.onclick = () => switchTab('labor');
        tabBtns.quiz.onclick = () => switchTab('quiz');

        // Hilfsrechner
        document.getElementById('mathCalcBtn').onclick = () => {
            try {
                const res = Function('"use strict";return (' + document.getElementById('mathInput').value.replace(/[^-()\d/*+.]/g, '') + ')')();
                document.getElementById('mathRes').innerText = res.toFixed(3);
            } catch (e) { document.getElementById('mathRes').innerText = "Err"; }
        };

        // ANALYSE STARTEN (Rechner & Labor)
        document.getElementById('mainActionBtn').onclick = () => {
            if(currentTab === 'quiz') return startQuizFlow();
            
            document.getElementById('viewResult').classList.remove('hidden');
            const is2 = document.getElementById('modeToggle').checked;
            
            if(currentTab === 'rechner') {
                const s = subDB[sSel.value];
                const im = parseFloat(document.getElementById('inM').value);
                const inN = parseFloat(document.getElementById('inN').value);
                const n = im ? im / s.m : inN;
                const m = inN ? inN * s.m : im;
                document.getElementById('outHeader').innerHTML = `<h2 class="text-2xl font-black">${s.name}</h2><p class="text-blue-500 font-bold">${toHTML(sSel.value)} | M = ${s.m} g/mol</p>`;
                document.getElementById('outBody').innerHTML = `<div class="bg-blue-50 p-4 rounded-xl text-center">n = ${n.toFixed(4)} mol</div><div class="bg-blue-50 p-4 rounded-xl text-center">m = ${m.toFixed(2)} g</div>`;
            } else if(currentTab === 'labor') {
                const r = reacDB[rSel.value];
                const val = parseFloat(document.getElementById('inEdukt').value);
                const prodMass = (val / r.mE) * r.ratio * r.mP;
                document.getElementById('outHeader').innerHTML = `<h2 class="text-xl font-black uppercase">${r.name}</h2><p class="text-blue-500 font-bold">${toHTML(r.eq)}</p>`;
                document.getElementById('outBody').innerHTML = `<div class="bg-blue-600 text-white p-6 rounded-xl col-span-2 text-center shadow-lg text-lg">Aus ${val}g ${toHTML(r.edu)} entstehen:<br><b class="text-3xl">${prodMass.toFixed(2)}g</b> ${toHTML(r.prod)}</div>`;
            }
            document.getElementById('maxError').innerText = errorPool[Math.floor(Math.random()*errorPool.length)];
        };

        // ÜBEN / QUIZ FLOW
        let qList = [], qIdx = 0, qScore = 0;
        function startQuizFlow() {
            const count = parseInt(document.getElementById('quizCount').value) || 5;
            const is2 = document.getElementById('modeToggle').checked;
            qList = []; qIdx = 0; qScore = 0;
            
            for(let i=0; i<count; i++) {
                if(is2 && Math.random() > 0.6) {
                    const r = reacDB[Object.keys(reacDB)[Math.floor(Math.random()*4)]];
                    const v = (Math.random()*20+5).toFixed(1);
                    qList.push({ type:'R', eq: r.eq, text: `Wieviel g <b>${r.prod}</b> entstehen aus ${v}g ${r.edu}?`, help:`M(${r.edu})=${r.mE} | M(${r.prod})=${r.mP}`, ans: (v/r.mE)*r.ratio*r.mP });
                } else {
                    const sk = Object.keys(subDB)[Math.floor(Math.random()*14)];
                    const s = subDB[sk]; const v = (Math.random()*5+1).toFixed(1); const toMol = Math.random() > 0.5;
                    qList.push({ type:'S', text: toMol ? `Berechne n von ${v}g ${s.name} (${toHTML(sk)})` : `Berechne m von ${v}mol ${s.name} (${toHTML(sk)})`, help:`M=${s.m} g/mol`, ans: toMol ? v/s.m : v*s.m });
                }
            }
            document.getElementById('viewQuiz').classList.remove('hidden');
            showQ();
        }

        function showQ() {
            const q = qList[qIdx];
            document.getElementById('quizProgress').innerText = `Frage ${qIdx+1} von ${qList.length}`;
            document.getElementById('quizContent').innerHTML = `
                <div class="space-y-6">
                    ${q.eq ? `<div class="bg-white/10 p-4 rounded-xl text-center text-xl font-mono">${toHTML(q.eq)}</div>` : ''}
                    <p class="text-lg italic text-blue-100">${q.text}</p>
                    <div class="bg-blue-900/50 p-3 rounded-lg border border-blue-500/30 text-[10px] font-bold text-blue-400 uppercase">Hilfe: ${toHTML(q.help)}</div>
                    <div class="flex gap-3">
                        <input type="number" id="qIn" class="bg-white/10 border border-white/20 p-4 rounded-2xl flex-1 text-2xl outline-none" placeholder="Antwort...">
                        <button onclick="checkQ()" class="bg-blue-600 px-10 rounded-2xl font-black">OK</button>
                    </div>
                    <p id="qFeed" class="h-6 font-bold text-center"></p>
                </div>`;
        }

        window.checkQ = function() {
            const val = parseFloat(document.getElementById('qIn').value);
            const isOk = Math.abs(val - qList[qIdx].ans) < 0.3;
            if(isOk) { qScore++; document.getElementById('qFeed').innerText = "✅ RICHTIG!"; document.getElementById('qFeed').className = "text-green-400 font-bold text-center"; }
            else { document.getElementById('qFeed').innerText = "❌ FALSCH! Lösung: " + qList[qIdx].ans.toFixed(2); document.getElementById('qFeed').className = "text-red-400 font-bold text-center"; }
            
            setTimeout(() => {
                qIdx++;
                if(qIdx < qList.length) showQ();
                else { document.getElementById('viewQuiz').classList.add('hidden'); document.getElementById('quizFinish').classList.remove('hidden'); document.getElementById('finalScoreText').innerText = `${qScore} / ${qList.length}`; }
            }, 2000);
        }
    </script>
</body>
</html>
