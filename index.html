<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molekül-Meister Pro Ultimate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        sub { font-size: 0.7em; vertical-align: sub; line-height: 0; }
        .tab-active { background-color: #2563eb; color: white; box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3); }
        .formula-box { font-family: 'Times New Roman', serif; font-style: italic; }
        .fraction { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; padding: 0 5px; }
        .fraction-top { border-bottom: 2px solid #ffffff; padding-bottom: 2px; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-900 pb-20">

    <div class="max-w-7xl mx-auto px-4 py-6">
        <header class="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-200 mb-6 flex flex-col lg:flex-row justify-between items-center gap-6">
            <div class="flex items-center gap-4">
                <div class="bg-blue-600 p-3 rounded-2xl text-white text-2xl">🧪</div>
                <div>
                    <h1 class="text-3xl font-black text-blue-900 uppercase tracking-tighter italic">Molekül-Meister <span class="text-blue-500">Ultimate</span></h1>
                    <p class="text-slate-500 text-xs font-bold uppercase tracking-widest">Digitales Chemie-Labor | Österreich Edition</p>
                </div>
            </div>
            
            <div class="flex flex-wrap justify-center gap-4 items-center bg-slate-50 p-4 rounded-3xl border">
                <div class="flex flex-col items-center border-r pr-4">
                    <span class="text-[9px] font-black text-slate-400 uppercase mb-1">Aufgabenanzahl</span>
                    <input type="range" id="globalTaskCount" min="5" max="20" value="10" class="w-32 accent-blue-600">
                    <span id="taskCountVal" class="text-blue-600 font-bold text-xs mt-1">10 Aufgaben</span>
                </div>
                <div class="flex items-center gap-3">
                    <span class="text-[9px] font-black text-slate-400 uppercase">Sek 1</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="modeToggle" class="sr-only peer">
                        <div class="w-12 h-6 bg-slate-300 rounded-full peer peer-checked:bg-blue-600 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:after:translate-x-full"></div>
                    </label>
                    <span class="text-[9px] font-black text-blue-600 uppercase">Sek 2</span>
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <div class="lg:col-span-4 space-y-6">
                <nav class="bg-white p-2 rounded-2xl shadow-sm border flex gap-1">
                    <button id="tab1" class="flex-1 py-3 text-[10px] font-black rounded-xl tab-active uppercase">Mol & Masse</button>
                    <button id="tab2" class="flex-1 py-3 text-[10px] font-black rounded-xl text-slate-500 uppercase hover:bg-slate-50">Labor</button>
                    <button id="tab3" class="flex-1 py-3 text-[10px] font-black rounded-xl text-slate-500 uppercase hover:bg-slate-50">Üben</button>
                    <button id="tab4" class="flex-1 py-3 text-[10px] font-black rounded-xl text-slate-500 uppercase hover:bg-slate-50">Quiz</button>
                </nav>

                <div class="bg-slate-900 p-6 rounded-[2rem] shadow-2xl border-b-4 border-blue-700">
                    <p class="text-[10px] font-black text-blue-400 uppercase mb-4 tracking-widest flex justify-between">
                        <span>Taschenrechner</span>
                        <span class="text-slate-500 text-[8px]">Dezimal: Komma</span>
                    </p>
                    <div class="bg-black/40 p-4 rounded-xl mb-4 text-right">
                        <div id="calcInput" class="text-slate-400 text-xs font-mono h-4 overflow-hidden mb-1"></div>
                        <div id="calcRes" class="text-green-400 text-3xl font-mono truncate">0,00</div>
                    </div>
                    <div class="grid grid-cols-4 gap-2">
                        <button onclick="calcKey('DEL')" class="bg-red-600 text-white p-3 rounded-lg font-bold text-xs hover:bg-red-500 transition-colors">DEL</button>
                        <button onclick="calcKey('(')" class="bg-white/5 text-white p-3 rounded-lg hover:bg-white/10 font-bold">(</button>
                        <button onclick="calcKey(')')" class="bg-white/5 text-white p-3 rounded-lg hover:bg-white/10 font-bold">)</button>
                        <button onclick="calcKey('/')" class="bg-blue-600 text-white p-3 rounded-lg hover:bg-blue-500 font-bold">÷</button>
                        
                        <button onclick="calcKey('7')" class="bg-white/5 text-white p-4 rounded-lg hover:bg-white/10 font-bold text-lg">7</button>
                        <button onclick="calcKey('8')" class="bg-white/5 text-white p-4 rounded-lg hover:bg-white/10 font-bold text-lg">8</button>
                        <button onclick="calcKey('9')" class="bg-white/5 text-white p-4 rounded-lg hover:bg-white/10 font-bold text-lg">9</button>
                        <button onclick="calcKey('*')" class="bg-blue-600 text-white p-3 rounded-lg hover:bg-blue-500 font-bold">×</button>

                        <button onclick="calcKey('4')" class="bg-white/5 text-white p-4 rounded-lg hover:bg-white/10 font-bold text-lg">4</button>
                        <button onclick="calcKey('5')" class="bg-white/5 text-white p-4 rounded-lg hover:bg-white/10 font-bold text-lg">5</button>
                        <button onclick="calcKey('6')" class="bg-white/5 text-white p-4 rounded-lg hover:bg-white/10 font-bold text-lg">6</button>
                        <button onclick="calcKey('-')" class="bg-blue-600 text-white p-3 rounded-lg hover:bg-blue-500 font-bold">-</button>

                        <button onclick="calcKey('1')" class="bg-white/5 text-white p-4 rounded-lg hover:bg-white/10 font-bold text-lg">1</button>
                        <button onclick="calcKey('2')" class="bg-white/5 text-white p-4 rounded-lg hover:bg-white/10 font-bold text-lg">2</button>
                        <button onclick="calcKey('3')" class="bg-white/5 text-white p-4 rounded-lg hover:bg-white/10 font-bold text-lg">3</button>
                        <button onclick="calcKey('+')" class="bg-blue-600 text-white p-3 rounded-lg hover:bg-blue-500 font-bold">+</button>

                        <button onclick="calcKey('0')" class="bg-white/5 text-white p-4 rounded-lg hover:bg-white/10 font-bold text-lg col-span-2">0</button>
                        <button onclick="calcKey(',')" class="bg-white/5 text-white p-4 rounded-lg hover:bg-white/10 font-bold text-lg">,</button>
                        <button onclick="calcExec()" class="bg-green-600 text-white p-4 rounded-lg hover:bg-green-500 font-black text-xl">=</button>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-8 space-y-6">
                <div id="viewMolMasse" class="bg-white p-8 rounded-[2rem] shadow-xl border border-slate-200">
                    <h2 class="text-2xl font-black text-blue-900 mb-6 flex items-center gap-3 uppercase tracking-tighter italic">
                        <span>Mol und Masse</span>
                        <span class="text-xs font-normal text-slate-400 not-italic">Berechnungstool</span>
                    </h2>

                    <div class="flex flex-wrap gap-2 mb-6 p-2 bg-slate-50 rounded-2xl border border-slate-100" id="filterContainer">
                        <button id="btnAll" onclick="filterSub('alle', this)" class="sub-filter-btn px-4 py-2 text-[10px] font-bold rounded-xl bg-blue-600 text-white">ALLE</button>
                        <button id="btnE" onclick="filterSub('E', this)" class="sub-filter-btn px-4 py-2 text-[10px] font-bold rounded-xl bg-white text-slate-500 border border-slate-200">ELEMENTE</button>
                        <button id="btnA" onclick="filterSub('A', this)" class="sub-filter-btn px-4 py-2 text-[10px] font-bold rounded-xl bg-white text-slate-500 border border-slate-200">ANORGANISCH</button>
                        <button id="btnO" onclick="filterSub('O', this)" class="sub-filter-btn px-4 py-2 text-[10px] font-bold rounded-xl bg-white text-slate-500 border border-slate-200">ORGANISCH</button>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-8">
                        <div class="space-y-4">
                            <label class="block">
                                <span class="text-[10px] font-black text-slate-400 uppercase ml-2">Substanz wählen</span>
                                <select id="molSubSelect" class="w-full mt-1 p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl font-bold focus:border-blue-500 outline-none transition-all cursor-pointer"></select>
                            </label>
                            
                            <div class="p-4 bg-blue-50 rounded-2xl flex items-center justify-between border border-blue-100">
                                <span class="text-[10px] font-bold text-blue-400 uppercase">Molare Masse M</span>
                                <span id="displayM" class="text-xl font-black text-blue-700 italic">0,00 g/mol</span>
                            </div>

                            <div class="flex gap-2">
                                <button onclick="setMolMode('n')" id="modeBtnN" class="flex-1 py-3 rounded-xl bg-blue-600 text-white text-[10px] font-black transition-all">N BERECHNEN (MOL)</button>
                                <button onclick="setMolMode('m')" id="modeBtnM" class="flex-1 py-3 rounded-xl bg-slate-100 text-slate-400 text-[10px] font-black transition-all">M BERECHNEN (G)</button>
                            </div>

                            <div class="relative">
                                <input type="text" id="molValInput" class="w-full p-4 pl-12 bg-white border-2 border-slate-100 rounded-2xl text-xl font-black outline-none focus:border-blue-500 transition-all" placeholder="Eingabe...">
                                <span id="molUnitLabel" class="absolute left-4 top-4 font-black text-slate-300 italic">m</span>
                            </div>
                            
                            <div class="flex gap-2">
                                <button onclick="calcMolMasse()" class="flex-[2] bg-blue-600 text-white py-4 rounded-2xl font-black shadow-lg shadow-blue-200 hover:bg-blue-700 active:scale-95 transition-all">BERECHNEN</button>
                                <button onclick="resetMolView()" class="flex-1 bg-slate-100 text-slate-400 py-4 rounded-2xl font-bold hover:bg-slate-200 transition-all uppercase text-[10px]">Neu</button>
                            </div>
                        </div>

                        <div class="bg-slate-900 rounded-[2rem] p-8 flex flex-col justify-center items-center text-white min-h-[300px] border-b-8 border-slate-700 relative overflow-hidden">
                            <div class="absolute top-4 left-4 text-[9px] font-bold text-slate-500 uppercase tracking-widest italic">Formel & Lösungsweg</div>
                            
                            <div id="molFormulaVisual" class="formula-box text-3xl flex items-center gap-2">
                                <span class="text-slate-600 italic">Bereit...</span>
                            </div>

                            <div id="molResultBox" class="mt-12 hidden text-center animate-in fade-in zoom-in duration-500 w-full">
                                <span class="block text-[10px] font-black text-slate-500 uppercase mb-2 tracking-tighter">Ergebnis</span>
                                <div id="molResultVal" class="text-4xl font-black text-green-400 p-6 bg-white/5 rounded-3xl border border-white/10 shadow-inner">--</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- STOFFDATENBANK ---
        const subDB = {
            "H": {m: 1.008, cat: "E", name: "Wasserstoff"},
            "He": {m: 4.003, cat: "E", name: "Helium"},
            "Li": {m: 6.941, cat: "E", name: "Lithium"},
            "C": {m: 12.011, cat: "E", name: "Kohlenstoff"},
            "N": {m: 14.007, cat: "E", name: "Stickstoff"},
            "O": {m: 15.999, cat: "E", name: "Sauerstoff"},
            "Na": {m: 22.990, cat: "E", name: "Natrium"},
            "Mg": {m: 24.305, cat: "E", name: "Magnesium"},
            "Al": {m: 26.982, cat: "E", name: "Aluminium"},
            "S": {m: 32.06, cat: "E", name: "Schwefel"},
            "Cl": {m: 35.45, cat: "E", name: "Chlor"},
            "Fe": {m: 55.845, cat: "E", name: "Eisen"},
            "Cu": {m: 63.546, cat: "E", name: "Kupfer"},
            "Au": {m: 196.97, cat: "E", name: "Gold"},
            "H2O": {m: 18.015, cat: "A", name: "Wasser"},
            "CO2": {m: 44.01, cat: "A", name: "Kohlenstoffdioxid"},
            "NaCl": {m: 58.44, cat: "A", name: "Kochsalz"},
            "HCl": {m: 36.46, cat: "A", name: "Salzsäure"},
            "NaOH": {m: 40.00, cat: "A", name: "Natronlauge"},
            "NH3": {m: 17.03, cat: "A", name: "Ammoniak"},
            "H2SO4": {m: 98.08, cat: "A", name: "Schwefelsäure"},
            "CH4": {m: 16.04, cat: "O", name: "Methan"},
            "C2H5OH": {m: 46.07, cat: "O", name: "Ethanol"},
            "CH3COOH": {m: 60.05, cat: "O", name: "Essigsäure"},
            "C6H12O6": {m: 180.16, cat: "O", name: "Glucose"},
            "C3H8": {m: 44.10, cat: "O", name: "Propan"}
        };

        // --- HELPER ---
        const toCom = (num) => num.toString().replace(/\./g, ',');
        const fromCom = (str) => parseFloat(str.replace(/,/g, '.'));
        function toUni(s) {
            const map = {'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉'};
            return s.replace(/(\d+)/g, (m) => [...m].map(c => map[c] || c).join(''));
        }

        // --- TASCHENRECHNER ---
        let currentExp = "";
        function calcKey(k) {
            if(k === 'DEL') {
                currentExp = "";
                document.getElementById('calcRes').innerText = "0,00";
            } else if(k === ',') {
                currentExp += '.';
            } else {
                currentExp += k;
            }
            document.getElementById('calcInput').innerText = currentExp.replace(/\./g, ',');
        }
        function calcExec() {
            try {
                let res = eval(currentExp);
                document.getElementById('calcRes').innerText = toCom(res.toLocaleString('de-AT', {minimumFractionDigits: 2, maximumFractionDigits: 3}));
            } catch(e) { document.getElementById('calcRes').innerText = "Err"; }
        }

        // --- MOL & MASSE LOGIK ---
        let molMode = 'n';

        function filterSub(cat, btn) {
            const select = document.getElementById('molSubSelect');
            select.innerHTML = "";
            Object.keys(subDB).forEach(key => {
                if(cat === 'alle' || subDB[key].cat === cat) {
                    let opt = document.createElement('option');
                    opt.value = key;
                    opt.innerText = `${subDB[key].name} (${toUni(key)})`;
                    select.appendChild(opt);
                }
            });
            
            // UI Button Style
            document.querySelectorAll('.sub-filter-btn').forEach(b => {
                b.classList.remove('bg-blue-600', 'text-white');
                b.classList.add('bg-white', 'text-slate-500');
            });
            if(btn) {
                btn.classList.add('bg-blue-600', 'text-white');
                btn.classList.remove('bg-white', 'text-slate-500');
            }
            updateM();
        }

        function updateM() {
            const key = document.getElementById('molSubSelect').value;
            if(!key) return;
            document.getElementById('displayM').innerText = toCom(subDB[key].m) + " g/mol";
        }

        document.getElementById('molSubSelect').onchange = updateM;

        function setMolMode(mode) {
            molMode = mode;
            document.getElementById('modeBtnN').className = mode === 'n' ? "flex-1 py-3 rounded-xl bg-blue-600 text-white text-[10px] font-black transition-all" : "flex-1 py-3 rounded-xl bg-slate-100 text-slate-400 text-[10px] font-black transition-all";
            document.getElementById('modeBtnM').className = mode === 'm' ? "flex-1 py-3 rounded-xl bg-blue-600 text-white text-[10px] font-black transition-all" : "flex-1 py-3 rounded-xl bg-slate-100 text-slate-400 text-[10px] font-black transition-all";
            document.getElementById('molUnitLabel').innerText = mode === 'n' ? 'm' : 'n';
            document.getElementById('molValInput').placeholder = mode === 'n' ? 'Masse in g eingeben...' : 'Stoffmenge in mol eingeben...';
            resetMolView();
        }

        function calcMolMasse() {
            const key = document.getElementById('molSubSelect').value;
            const M = subDB[key].m;
            const rawIn = document.getElementById('molValInput').value;
            const inputVal = fromCom(rawIn);

            if(isNaN(inputVal)) return alert("Bitte einen gültigen Zahlenwert eingeben!");

            const visual = document.getElementById('molFormulaVisual');
            const resBox = document.getElementById('molResultBox');
            const resVal = document.getElementById('molResultVal');

            if(molMode === 'n') {
                const n = inputVal / M;
                visual.innerHTML = `
                    <span class="text-blue-400 italic">n</span> = 
                    <div class="fraction text-white">
                        <span class="fraction-top text-blue-300 font-bold">${toCom(inputVal)} g</span>
                        <span class="text-slate-400 font-bold">${toCom(M)} g/mol</span>
                    </div>
                `;
                resVal.innerText = toCom(n.toFixed(4)) + " mol";
            } else {
                const m = inputVal * M;
                visual.innerHTML = `
                    <span class="text-blue-400 italic">m</span> = 
                    <span class="text-blue-300 font-bold">${toCom(inputVal)} mol</span> · 
                    <span class="text-slate-400 font-bold">${toCom(M)} g/mol</span>
                `;
                resVal.innerText = toCom(m.toFixed(2)) + " g";
            }
            resBox.classList.remove('hidden');
        }

        function resetMolView() {
            document.getElementById('molValInput').value = "";
            document.getElementById('molFormulaVisual').innerHTML = '<span class="text-slate-600 italic">Bereit...</span>';
            document.getElementById('molResultBox').classList.add('hidden');
        }

        // Slider
        document.getElementById('globalTaskCount').oninput = (e) => {
            document.getElementById('taskCountVal').innerText = e.target.value + " Aufgaben";
        };

        // Init App
        window.onload = () => {
            filterSub('alle', document.getElementById('btnAll'));
        };
    </script>
</body>
</html>
